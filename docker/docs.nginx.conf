server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    charset utf-8;

    # 运维探针（容器编排用，非协议接口）。见 docs/interfaces.md §7。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 目录浏览：spec/ 与 design/ 都是文件集合，用 autoindex 比生成页面更省事
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # Markdown 以纯文本呈现（本站只做只读查阅，不做渲染）
    location ~* \.md$ {
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
